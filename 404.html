<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없어요 · Gaeo</title>
<!-- GitHub Pages가 존재하지 않는 경로에 이 파일을 HTTP 404 상태와 함께 서빙한다.
     404는 색인 대상이 아니므로 noindex를 명시한다(soft 404 방지). -->
<meta name="robots" content="noindex">
<meta name="description" content="요청하신 페이지가 없습니다. 개오 애널리스트팀 홈이나 전체 글 목록에서 원하는 내용을 찾아보세요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --background:#090909; --surface:#141414; --border:#242424;
    --text:#F5F5F5; --text-secondary:#A1A1AA; --text-muted:#71717A;
  }
  *{box-sizing:border-box}
  html{background:var(--background);color-scheme:dark}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--background);color:var(--text);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:15px;line-height:1.7;letter-spacing:-.02em;word-break:keep-all;padding:24px;
  }
  main{max-width:480px;text-align:center}
  .code{font-size:13px;font-weight:600;color:var(--text-muted);letter-spacing:.08em;margin-bottom:12px}
  h1{font-size:24px;font-weight:700;margin:0 0 12px;letter-spacing:-.03em}
  p{margin:0 0 28px;color:var(--text-secondary)}
  nav{display:flex;flex-direction:column;gap:10px}
  nav a{
    display:block;padding:13px 18px;border:1px solid var(--border);border-radius:14px;
    background:var(--surface);color:var(--text);text-decoration:none;font-weight:600;font-size:14.5px;
  }
  nav a:hover{border-color:#303030}
  nav a small{display:block;font-weight:400;font-size:12.5px;color:var(--text-muted);margin-top:2px}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>페이지를 찾을 수 없어요</h1>
  <p>주소가 바뀌었거나 삭제된 페이지예요.<br>아래에서 원하시는 내용을 다시 찾아보세요.</p>
  <nav aria-label="다른 페이지로 이동">
    <a href="/">Gaeo 홈<small>오늘 시장 브리핑과 전체 종목 판단</small></a>
    <a href="/snap/index.html">전체 글 목록<small>뉴스분석 · 종목공부 · 주식공부 · 부동산공부</small></a>
    <a href="/research/deep-analysis/">정밀분석 기록<small>종목별 정밀분석 Historical Research Record</small></a>
  </nav>
</main>
</body>
</html>
