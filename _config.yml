# GitHub Pages(Jekyll) 배포 제외 목록
#
# ⚠️ 이것만으로는 보안이 되지 않는다. 이 저장소는 public이라
#    GitHub raw URL로는 여전히 접근할 수 있다. 그래서 Research Prediction 원본은
#    research_crypto로 AES-256-GCM 암호화해서 저장한다(암호문만 커밋).
#    이 파일은 "사이트 주소로도 굳이 내보내지 않는다"는 최소 조치다.
#
# 실측(2026-08-15): 이 설정 전에는
#   https://gaeoteam.com/research_archive/dart/corp_map.json → HTTP 200
exclude:
  - research_archive/
  # 🧪 모의투자 V2(smart_v2)·V3(scalp_v3)의 원기록(원장·상태 파일).
  #    화면은 파생 요약(paper_public.js)만 읽으므로 원기록 폴더는 사이트 주소로
  #    굳이 내보내지 않는다(2026-08-27부터 V2·V3도 버전 탭으로 공개되지만, 공개는
  #    어디까지나 paper_public.js 경유다). V1(paper_trading/ 최상위)은 화면이
  #    history.json을 직접 읽는 설계라 제외하지 않는다.
  - paper_trading/smart_v2/
  - paper_trading/scalp_v3/
  - docs/
  - "*.py"
  - "*.command"
  - .claude/
  # ⚖️ 2026-09-16 LEGAL GATE: 네이버 응답 필드를 그대로 담은 파이프라인 중간 파일과, 사이트가 읽지 않는
  #    공급자 파생 폴더는 사이트 주소로 내보내지 않는다(raw GitHub 로는 여전히 접근 가능 — 완전 차단 아님).
  - analysis_data.json
  - flow_history/
  - dart_financials/
