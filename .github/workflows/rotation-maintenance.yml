name: rotation-maintenance

on:
  workflow_dispatch:
  schedule:
    # 매주 월요일 05:15 KST. 장 시작 전 과거 검증과 모델 교정을 다시 계산한다.
    - cron: "15 20 * * 0"

permissions:
  contents: write

concurrency:
  group: rotation-maintenance-main
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 누수 방지 테스트와 과거 검증
        run: |
          python3 -m unittest test_rotation test_rotation_workflow test_rotation_picks -v
          python3 backtest_rotation.py
          python3 compute_rotation.py --mode intraday

      - name: 검증 결과 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rotation_model.json rotation_snapshot.js
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "순환매 모델 주간 검증 갱신 [skip ci]"
          git pull --rebase origin main
          git push origin main
