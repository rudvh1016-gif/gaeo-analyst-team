name: rotation-maintenance

on:
  workflow_dispatch:
  schedule:
    # 매주 월요일 05:15 KST. 장 시작 전 과거 검증과 모델 교정을 다시 계산한다.
    - cron: "15 20 * * 0"

permissions:
  contents: write

concurrency:
  group: rotation-maintenance-main
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # 2026-08-28: fetch-depth 0 → 1.
          # 이 잡이 돌리는 스크립트(backtest_rotation.py · compute_rotation.py ·
          # test_rotation*.py)에는 git 호출이 한 줄도 없어서 전체 이력이 필요 없었다.
          # 그런데 이 저장소는 매일 약 56MB씩 커져서(price_history.js·analysis_data.json
          # 등 대용량 생성물이 매 사이클 통째로 다시 커밋된다) 매주 GB 단위를 받고 있었다.
          # 아래 커밋·push는 얕은 클론에서도 된다 — research-archive.yml ·
          # market-universe-smoke-test.yml · dart-live-smoke-test.yml 이 같은 조합
          # (fetch-depth 1 + pull --rebase + push)으로 이미 돌고 있다.
          # 전체 이력이 진짜로 필요한 곳은 compact-history.yml 하나뿐이다(이력 재작성).
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 누수 방지 테스트와 과거 검증
        run: |
          python3 -m unittest test_rotation test_rotation_workflow test_rotation_picks -v
          python3 backtest_rotation.py
          python3 compute_rotation.py --mode intraday

      - name: 검증 결과 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rotation_model.json rotation_snapshot.js
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "순환매 모델 주간 검증 갱신 [skip ci]"
          git pull --rebase origin main
          git push origin main
