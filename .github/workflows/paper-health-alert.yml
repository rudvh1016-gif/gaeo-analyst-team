# 개오 모의투자 — 러너 상태 알림 (세션 독립)
#
# 왜 있나 (2026-08-19 사고)
#   집 PC 러너가 하루 12사이클을 전부 실패했는데 아무도 몰랐다. 실패는
#   paper_trading/state.json 에 남아 있었지만, 그걸 읽어 알려주는 건
#   check_pipeline.py(Claude 세션 시작 훅)뿐이라 "세션을 여는 사람"이 없으면
#   며칠이 조용히 비어도 아무 신호가 없었다. 이 워크플로가 세션과 무관하게
#   하루 한 번 상태를 보고 GitHub Issue로 알린다.
#
# 2026-08-26에 막은 구멍 (Silent Runner)
#   예전 판정은 "오늘 시도 기록이 아예 없다"를 무조건 SKIP으로 넘겼다. 그래서
#   러너 PC나 VM이 통째로 꺼져 하루 종일 아무 것도 안 돌아도 알림이 0건이었다.
#   실패보다 이쪽이 더 위험한데(기록이 통째로 비고, 보유일 계산까지 밀린다)
#   화재경보기가 없었던 셈이다. 이제 "오늘이 거래일이었는가"를 러너와 무관한
#   증거(price_history.js — GitHub Actions가 독립적으로 갱신)로 확인해서,
#   거래일인데 기록이 0건이면 별도 제목의 이슈를 연다.
#   판정 로직은 저장소 루트의 paper_health_check.py에 있다(사람이 직접 돌려볼 수 있고
#   test_paper_health_check.py가 실제 공휴일 날짜로 회귀를 고정한다).
#
# 안전 규칙 (바꾸지 말 것)
#   - 토스 API를 호출하지 않는다. 저장소 파일만 읽는다.
#     GitHub 러너 IP는 토스에서 막힌다(AGENTS.md 모의투자 절).
#   - 새 Secret을 요구하지 않는다. GITHUB_TOKEN(github.token)만 쓴다.
#   - 저장소에 아무것도 커밋·push 하지 않는다. 이슈만 만들고 닫는다.
#   - 이슈는 제목이 같은 열린 이슈를 재사용한다(중복 폭증 금지).
#   - 확신이 없으면 침묵한다. 거래일 증거를 못 읽으면 알리지 않는다
#     (허위 알림이 쌓이면 진짜 알림도 무시하게 된다).
name: paper-health-alert

on:
  schedule:
    # 07:30 UTC = 16:30 KST — 장 마감(15:30) + 마지막 사이클(15:05) 이후 하루 1회면 충분하다.
    # 요일 필터(1-5)가 주말을 걸러 주고, 공휴일은 아래 거래일 증거 판정이 거른다.
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read      # checkout 전용(쓰기 없음)
  issues: write       # 알림 이슈 생성·댓글·닫기

concurrency:
  group: paper-health-alert
  cancel-in-progress: false

jobs:
  check:
    # 포크에서는 돌지 않는다(남의 저장소에 이슈를 만들지 않게).
    if: github.repository == 'rudvh1016-gif/gaeo-analyst-team'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
      GH_TOKEN: ${{ github.token }}
      # 두 알림은 성격이 다르므로 제목이 서로 달라야 한다.
      #   FAIL_TITLE   러너는 살아 있는데 사이클이 실패했다
      #   SILENT_TITLE 러너가 오늘 아예 한 번도 실행되지 않았다
      FAIL_TITLE: "🛑 모의투자 러너 사이클 실패 (집 PC 자동 기록 중단)"
      SILENT_TITLE: "🛑 [GAEO Paper] 오늘 모의투자가 실행되지 않았습니다"
    steps:
      - uses: actions/checkout@v4

      - name: 상태 판정 (저장소 파일만 읽음)
        id: check
        # stdout은 통째로 GITHUB_OUTPUT(key=value)으로 들어간다.
        # 사람이 읽을 로그는 스크립트가 stderr로 낸다.
        run: python3 paper_health_check.py >> "$GITHUB_OUTPUT"

      - name: 실패 시 알림 이슈 생성 또는 갱신
        if: steps.check.outputs.status == 'FAIL'
        env:
          REASON: ${{ steps.check.outputs.reason }}
          CYCLE_AT: ${{ steps.check.outputs.cycle_at }}
        run: |
          set -euo pipefail
          cat > /tmp/paper_alert.md <<EOF
          모의투자 러너가 오늘 사이클에 실패했습니다.

          - 마지막 시도: \`${CYCLE_AT}\`
          - 실패 코드: \`${REASON}\`
          - 확인 파일: \`paper_trading/state.json\` 의 \`lastCycleResult\`

          ## 조치 순서

          1. 지금 활성인 러너가 어디인지 먼저 봅니다: \`paper_runner_config.json\` 의 \`activeRunner\`.
          2. 그 러너에서 진단 스크립트를 돌립니다(읽기 전용, 아무것도 고치지 않습니다).
             - 집 Windows PC:
               \`\`\`
               powershell -ExecutionPolicy Bypass -File scripts\\paper_doctor.ps1
               \`\`\`
             - Oracle Linux VM:
               \`\`\`
               bash scripts/paper_doctor.sh
               \`\`\`
          3. 진단 결과에서 아래 두 가지를 먼저 봅니다. 지금까지 실제로 있었던 원인입니다.
             - **작업 스케줄러가 부트스트랩을 안 거치고 있다**: 스케줄러가
               \`%LOCALAPPDATA%\\GAEO\\run-paper.ps1\`(부트스트랩) 대신
               \`scripts/paper_cycle.ps1\`을 직접 실행하면, DPAPI로 암호화된 자격증명이
               환경에 안 실려서 시세를 못 받습니다.
             - **로그온 방식이 InteractiveToken이 아니다**: 작업이 "사용자의 로그온 여부에 관계없이 실행"
               (S4U/서비스 토큰)으로 잡혀 있으면 DPAPI 복호화가 실패합니다.
               "사용자가 로그온할 때만 실행"(InteractiveToken)이어야 합니다.
          4. 그래도 원인을 못 찾으면 \`docs/PAPER_TRADING_LOCAL_RUNNER.md\`(집 PC) 또는
             \`docs/PAPER_TRADING_ORACLE_RUNNER.md\`(Oracle VM)의 점검 절차를 따릅니다.

          ## 참고

          - 이 이슈는 평일 16:30 KST에 자동 점검이 만듭니다. 다음 점검에서 사이클이 정상이면 자동으로 닫힙니다.
          - 이 워크플로는 저장소 파일만 읽습니다. 토스 API를 호출하지 않고, 아무것도 커밋하지 않습니다.
          EOF

          NUM=$(gh issue list --state open --limit 100 --json number,title \
                --jq "map(select(.title == \"${FAIL_TITLE}\")) | .[0].number // empty")
          if [ -n "$NUM" ]; then
            echo "기존 알림 이슈 #$NUM 갱신"
            gh issue comment "$NUM" --body-file /tmp/paper_alert.md
          else
            echo "새 알림 이슈 생성"
            gh issue create --title "$FAIL_TITLE" --body-file /tmp/paper_alert.md
          fi

      - name: 오늘 한 번도 실행되지 않았으면 알림 이슈 생성 또는 갱신
        if: steps.check.outputs.status == 'MISSING'
        env:
          REASON: ${{ steps.check.outputs.reason }}
          CYCLE_AT: ${{ steps.check.outputs.cycle_at }}
          EVIDENCE: ${{ steps.check.outputs.evidence }}
          TODAY: ${{ steps.check.outputs.today }}
        run: |
          set -euo pipefail
          cat > /tmp/paper_silent.md <<EOF
          오늘(\`${TODAY}\` KST)은 거래일인데 모의투자 사이클 기록이 **한 건도** 없습니다.
          사이클이 실패한 게 아니라 **아예 실행되지 않았다**는 뜻입니다. 러너 PC나 VM이
          꺼져 있거나, 예약 실행이 꺼졌거나, 활성 러너 설정이 어긋난 상태입니다.

          - 마지막으로 남은 사이클 기록: \`${CYCLE_AT:-없음}\`
          - 판정 사유: \`${REASON}\`
          - 거래일 증거(러너와 무관): \`${EVIDENCE}\` (price_history.js에 오늘 일봉이 있음)

          ## 확인 순서

          1. **지금 활성인 러너가 어디인가**: \`paper_runner_config.json\` 의 \`activeRunner\`.
             여기 적힌 러너만 기록을 남깁니다. 다른 러너는 켜져 있어도 아무 일도 하지 않습니다.
          2. **그 러너가 켜져 있는가**
             - 집 Windows PC: PC 전원과 Windows 로그인 상태, 작업 스케줄러의
               "GAEO Paper Trading" 작업이 사용 안 함(Disabled)이 아닌지.
               진단: \`powershell -ExecutionPolicy Bypass -File scripts\\paper_doctor.ps1\`
             - Oracle Linux VM: \`systemctl status gaeo-paper.timer\` 와
               \`systemctl list-timers gaeo-paper*\`.
               진단: \`bash scripts/paper_doctor.sh\`
          3. **러너가 자기 이름을 선언했는가**: 환경변수 \`GAEO_PAPER_RUNNER\`.
             선언이 없으면 안전을 위해 아무 것도 하지 않습니다(원장을 두 곳에서 쓰는 사고 방지).
          4. 원인을 찾으면 그 러너에서 한 사이클을 손으로 돌려 기록이 남는지 확인합니다.

          ## 참고

          - 오늘이 거래일이라는 판단은 러너가 쓰는 파일이 아니라 \`price_history.js\`
            (GitHub Actions가 갱신하는 일봉 기록)로 했습니다. 휴장일에는 그 날짜가 아예
            생기지 않으므로 공휴일에는 이 이슈가 열리지 않습니다.
          - 증거 파일을 못 읽거나 오늘 일봉이 없으면 이 점검은 **아무 말도 하지 않습니다**
            (허위 알림보다 침묵이 낫다는 원칙).
          - 다음 점검에서 오늘 사이클 기록이 확인되면 이 이슈는 자동으로 닫힙니다.
          EOF

          NUM=$(gh issue list --state open --limit 100 --json number,title \
                --jq "map(select(.title == \"${SILENT_TITLE}\")) | .[0].number // empty")
          if [ -n "$NUM" ]; then
            echo "기존 미실행 이슈 #$NUM 갱신"
            gh issue comment "$NUM" --body-file /tmp/paper_silent.md
          else
            echo "새 미실행 이슈 생성"
            gh issue create --title "$SILENT_TITLE" --body-file /tmp/paper_silent.md
          fi

      - name: 정상 복구 시 열려 있던 실패 이슈 닫기
        if: steps.check.outputs.status == 'OK'
        run: |
          set -euo pipefail
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                --jq "map(select(.title == \"${FAIL_TITLE}\")) | .[0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "오늘 사이클이 정상(CYCLE_OK)으로 확인돼 자동으로 닫습니다." \
              --reason completed
          else
            echo "정상: 열린 알림 이슈 없음"
          fi

      - name: 다시 돌기 시작하면 미실행 이슈 닫기
        # OK뿐 아니라 FAIL에서도 닫는다 — 실패했다는 건 러너가 실행은 됐다는 뜻이고,
        # 그 상황은 위 실패 이슈가 따로 알린다. 같은 사실로 이슈 2개를 열어 두지 않는다.
        if: steps.check.outputs.status == 'OK' || steps.check.outputs.status == 'FAIL'
        env:
          STATUS: ${{ steps.check.outputs.status }}
          CYCLE_AT: ${{ steps.check.outputs.cycle_at }}
        run: |
          set -euo pipefail
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                --jq "map(select(.title == \"${SILENT_TITLE}\")) | .[0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --reason completed \
              --comment "오늘 사이클 기록(${CYCLE_AT})이 확인돼 자동으로 닫습니다. 현재 판정: ${STATUS}"
          else
            echo "정상: 열린 미실행 이슈 없음"
          fi
