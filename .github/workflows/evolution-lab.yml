# GAEO Evolution Lab — 주 1회, 장 닫힌 시간, 결정론(무LLM) 연구 실행.
#
# 하는 일: Baseline 성적표 갱신 · Failure Mining · Deterministic Candidate 연구 ·
#          Gate 판정(Bootstrap) · 공개 Status 갱신 · 대표에게 GitHub Issue로 실행결과 보고.
# 안 하는 일: Claude/LLM API 호출(credential 가정 금지) · Production 코드 수정 ·
#             Constitution/Benchmark/Workflow 변경 · 시장시간 실행 · 외부 알림 서비스 사용.
#
# 커밋 안전장치: Constitution의 autoCommitAllowlist 밖 파일이 하나라도 변경되면
#                커밋하지 않고 FAIL한다(FAIL CLOSED).
#
# 알림(2026-08-23 추가): 이 Run이 성공/실패/승인대기 중 무엇이든, 마지막 Notification
# 단계는 `if: always()`로 항상 실행되어 대표(repository owner)에게 GitHub Issue
# 1개를 만든다(🟢 정상/🟠 승인필요/🔴 점검필요). 알림 로직은 gaeo_evolution/notification.py
# (순수 함수, 네트워크·LLM 호출 없음)가 내용을 결정하고, 실제 이슈 생성·assignee·검색은
# 이 워크플로우의 `gh` CLI(GITHUB_TOKEN)만 쓴다(paper-health-alert.yml과 같은 방식).
# 알림 실패는 워크플로우를 FAIL시키되, Production 판단·Candidate 상태는 절대 건드리지 않는다.
name: evolution-lab

on:
  workflow_dispatch:
  # ▶️ 2026-08-22 주간 자동 실행 복구.
  #    (2026-08-22 오전 독립 감사로 일시중단했던 schedule.
  #     recon 오염 차단 · sim-vs-sim 공정 비교 · Candidate 불변성/실험 영구기록 ·
  #     실제 Shadow 기록기 · Gate 하위그룹 보호 + Rollback 연결 수리와
  #     계약 테스트/고의 실패 시험 통과를 확인한 뒤 다시 켰다.)
  schedule:
    - cron: "0 23 * * 6"   # 토 23:00 UTC = 일 08:00 KST — 다른 워크플로와 충돌 없음

concurrency:
  group: evolution-lab
  cancel-in-progress: false

permissions:
  contents: write
  issues: write   # 대표에게 보내는 주간 실행결과 Issue 생성용(최소 권한만 추가)

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: "3.12"

      # Memory 암호화 저장(research_crypto)에 필요 — ci.yml·research-archive 등
      # 다른 워크플로와 같은 방식. 없으면 Key가 있어도 상세 저장이 조용히 생략됐다
      # (2026-08-22 수리에서 발견된 기존 누락).
      - name: 암호화 라이브러리 설치
        id: install_deps
        run: python3 -m pip install --quiet --upgrade cryptography

      # 계약 테스트가 먼저다 — 미래정보·표본조작·보호경로 위반은 여기서 막힌다.
      - name: Harness contract tests
        id: contract_tests
        run: python -m unittest test_gaeo_evolution -q

      - name: Run deterministic evolution lab
        id: run_lab
        env:
          # Key가 없으면 상세 Memory 저장은 생략된다(평문 fallback 없음).
          RESEARCH_ARCHIVE_KEY: ${{ secrets.RESEARCH_ARCHIVE_KEY }}
        run: python run_evolution_lab.py

      # ── Coverage Guardian (2026-08-25 추가) ─────────────────────────────────
      # "600종목이 정말 600종목인가"를 실측만 한다. tickers.js·data.js·
      # auto_analysis.js·coverage_version.py를 읽기만 하고, 종목을 자동으로
      # 교체하는 경로가 코드에 없다. 산출물은 gaeo_coverage/state/*.json 뿐이고
      # 그 경로만 Constitution autoCommitAllowlist에 추가돼 있다.
      # 실패해도 연구 결과 커밋을 막지 않는다(측정 실패는 알림에서 '측정값 없음').
      # if: always() — 연구 실행이 실패한 주에도 Coverage 실측은 보고해야 한다.
      # (이 단계가 성공해도, 앞 단계가 실패하면 allowlist/commit 단계는 기본
      #  success() 조건 때문에 그대로 건너뛴다 — 커밋 경로가 열리지 않는다.)
      - name: Coverage Guardian (읽기 전용 실측)
        id: coverage_guard
        if: always()
        run: |
          set -uo pipefail
          # 개별 실패는 삼키지 않고 기록만 한 뒤, 마지막에 '이번 Run이 실제로
          # 산출물을 만들었는가'를 확인해 못 만들었으면 이 단계를 FAIL시킨다.
          # (2026-08-25 보안 감사 MEDIUM: 측정 실패인데 지난주 state가 그대로 남아
          #  이번 주 숫자처럼 🟢 GREEN으로 나가던 문제.)
          RUN_DAY="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          python3 -m gaeo_coverage.guardian \
            || echo "coverage guardian 실패" 1>&2
          python3 -m gaeo_coverage.standby \
            || echo "standby pool 실패" 1>&2
          python3 -m gaeo_coverage.proposal \
            || echo "replacement proposal 실패" 1>&2
          RUN_DAY="$RUN_DAY" python3 -c "
          import json, os, sys
          day = os.environ['RUN_DAY']
          bad = []
          for path in ('gaeo_coverage/state/coverage_state.json',
                       'gaeo_coverage/state/standby_pool.json',
                       'gaeo_coverage/state/replacement_proposal.json'):
              try:
                  doc = json.load(open(path, encoding='utf-8'))
              except Exception as e:
                  bad.append('%s 읽기 실패(%s)' % (path, type(e).__name__)); continue
              got = str(doc.get('generatedAt') or '')[:10]
              if got != day:
                  bad.append('%s 가 이번 Run(%s)이 아니라 %s 자료다' % (path, day, got or '알 수 없음'))
          if bad:
              print('Coverage 측정 실패:', '; '.join(bad)); sys.exit(1)
          print('Coverage 산출물 3종 모두 이번 Run(%s) 기준' % day)
          "

      - name: Enforce commit allowlist (FAIL CLOSED)
        id: allowlist
        run: |
          set -euo pipefail
          # untracked(신규 파일 — 예: 새 shadow ledger)까지 포함해 전수 검사한다.
          CHANGED=$(git status --porcelain | awk '{print $NF}')
          echo "changed files:"; echo "$CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "noop=true" >> "$GITHUB_OUTPUT"
            echo "변경 없음 — no-op fast exit"
            exit 0
          fi
          echo "noop=false" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" | python -c "
          import sys
          sys.path.insert(0, '.')
          from gaeo_evolution import constitution
          const = constitution.load()
          changed = [l.strip() for l in sys.stdin if l.strip()]
          violations, outside = constitution.check_changed_paths(changed, const)
          if violations or outside:
              print('커밋 금지 — allowlist 밖 변경:', violations + outside)
              sys.exit(1)
          links = constitution.find_symlinks(changed, '.')
          if links:
              print('커밋 금지 — 심볼릭 링크 감지:', links)
              sys.exit(1)
          print('allowlist OK:', changed)
          "

      # production_config.json은 자동 런타임이 '해제/previousStable 복원' 방향으로만
      # 바꿀 수 있다 — override 활성화(=자동 승격 경로)는 여기서 차단한다(FAIL CLOSED).
      - name: Verify production_config change is deactivation-only
        id: verify_config
        if: steps.allowlist.outputs.noop == 'false'
        run: |
          set -euo pipefail
          # git 오류와 '변경 없음'을 섞지 않는다 — status 실패는 여기서 즉시 FAIL.
          PC_CHANGED=$(git status --porcelain -- gaeo_evolution/production_config.json)
          if [ -n "$PC_CHANGED" ]; then
            python - <<'PY'
          import json, subprocess, sys
          sys.path.insert(0, '.')
          from gaeo_evolution import production_config as pc
          try:
              shown = subprocess.run(
                  ["git", "show", "HEAD:gaeo_evolution/production_config.json"],
                  capture_output=True, text=True, check=True).stdout
              old = json.loads(shown)
          except subprocess.CalledProcessError:
              old = None            # 저장소에 아직 없던 파일
          new = json.load(open("gaeo_evolution/production_config.json"))
          ok, why = pc.is_auto_change_safe(old, new)
          print("production_config 자동 변경 검사:", why)
          sys.exit(0 if ok else 1)
          PY
          else
            echo "production_config 변경 없음"
          fi

      - name: Commit allowlisted results
        id: commit
        if: steps.allowlist.outputs.noop == 'false'
        run: |
          # '변경 없음'과 '진짜 git 오류'를 구분한다 — 오류는 워크플로우 FAIL(초록색 금지).
          set -euo pipefail
          git config user.name "gaeo-evolution-lab"
          git config user.email "actions@users.noreply.github.com"
          for p in gaeo_evolution/registry/ gaeo_evolution/status/ research_archive/evolution/ gaeo_evolution/production_config.json gaeo_coverage/state/; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "스테이지된 변경 없음 — 정상 no-op"
            exit 0
          fi
          git commit -m "evolution: 주간 결정론 연구 기록 갱신 [skip ci]"
          git pull --no-rebase -q origin main
          git push origin HEAD:main

      # ── 대표에게 보내는 주간 실행결과 알림 ──────────────────────────────────
      # if: always() — 위 단계 중 어디서 실패해도(계약 테스트·연구 실행·커밋 등)
      # 이 단계는 반드시 실행되어 🔴 점검 필요 이슈를 만든다. 알림 내용 자체는
      # gaeo_evolution/notification.py(순수 함수, LLM·네트워크 호출 없음)가
      # status.json/promotion_cards.json만 읽어 결정론적으로 만든다.
      - name: 알림 내용 결정 (Notification Builder — 상태 파일만 읽음)
        id: notify_build
        if: always()
        env:
          TZ: Asia/Seoul
          # ⚠️ 실패 감지는 이 job의 '모든' 단계를 본다 — contract_tests 이후만 보면
          # checkout/setup-python/install_deps가 실패했을 때 놓쳐서, 실제로는 job이
          # 실패했는데 오래된(stale) status.json을 읽고 🟢 "정상 완료"로 거짓 보고하는
          # 사고가 난다(독립 QA 감사 HIGH, 2026-08-23 발견·수리).
          OUTCOME_CHECKOUT: ${{ steps.checkout.outcome }}
          OUTCOME_SETUP_PYTHON: ${{ steps.setup_python.outcome }}
          OUTCOME_INSTALL_DEPS: ${{ steps.install_deps.outcome }}
          OUTCOME_CONTRACT_TESTS: ${{ steps.contract_tests.outcome }}
          OUTCOME_RUN_LAB: ${{ steps.run_lab.outcome }}
          OUTCOME_COVERAGE_GUARD: ${{ steps.coverage_guard.outcome }}
          OUTCOME_ALLOWLIST: ${{ steps.allowlist.outcome }}
          OUTCOME_VERIFY_CONFIG: ${{ steps.verify_config.outcome }}
          OUTCOME_COMMIT: ${{ steps.commit.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # ⚠️ GitHub Actions 스텝 outcome은 success/failure/cancelled/skipped
          # 4가지다. "failure"만 검사하면 이 job의 timeout-minutes(20분) 초과나
          # 사람이 Actions 화면에서 수동 취소한 경우(outcome=cancelled)를 놓쳐서
          # stale status.json으로 거짓 🟢 GREEN 보고가 재발한다(독립 QA 감사
          # HIGH, 2026-08-23 발견·수리 — 원래 HIGH와 증상 동일, 트리거만 다름).
          is_bad() { [ "$1" = "failure" ] || [ "$1" = "cancelled" ]; }
          FAILED_STEP=""
          if is_bad "$OUTCOME_CHECKOUT"; then
            FAILED_STEP="Checkout"
          elif is_bad "$OUTCOME_SETUP_PYTHON"; then
            FAILED_STEP="setup-python"
          elif is_bad "$OUTCOME_INSTALL_DEPS"; then
            FAILED_STEP="암호화 라이브러리 설치"
          elif is_bad "$OUTCOME_CONTRACT_TESTS"; then
            FAILED_STEP="Harness contract tests"
          elif is_bad "$OUTCOME_RUN_LAB"; then
            FAILED_STEP="Run deterministic evolution lab"
          elif is_bad "$OUTCOME_COVERAGE_GUARD"; then
            FAILED_STEP="Coverage Guardian"
          elif is_bad "$OUTCOME_ALLOWLIST"; then
            FAILED_STEP="Enforce commit allowlist"
          elif is_bad "$OUTCOME_VERIFY_CONFIG"; then
            FAILED_STEP="Verify production_config change is deactivation-only"
          elif is_bad "$OUTCOME_COMMIT"; then
            FAILED_STEP="Commit allowlisted results"
          fi
          JOB_FAILED="false"
          if [ -n "$FAILED_STEP" ]; then JOB_FAILED="true"; fi
          echo "판정 — 실패단계:[$FAILED_STEP] job_failed=$JOB_FAILED" 1>&2

          # notification.py 호출 자체가 실패하는 경우는 최소 두 가지다 — ①checkout
          # 자체가 실패해 저장소 파일(gaeo_evolution 패키지)이 없는 경우 ②상태
          # 파일은 있지만 형식이 손상된 경우(독립 QA 감사 LOW). 원인이 무엇이든
          # "이슈 0개"가 되면 안 되므로(독립 QA 감사 MEDIUM), 저장소 파일 없이도
          # 만들 수 있는 최소 폴백 알림을 생성한다 — 문구는 원인을 단정하지 않는다.
          if python3 -m gaeo_evolution.notification build \
              --owner "$OWNER" --run-id "$RUN_ID" --run-url "$RUN_URL" \
              --job-failed "$JOB_FAILED" --failed-step "$FAILED_STEP" \
              --coverage gaeo_coverage/state/coverage_state.json \
              --standby gaeo_coverage/state/standby_pool.json \
              --proposal gaeo_coverage/state/replacement_proposal.json \
              --out /tmp/gaeo_notify.json; then
            :
          else
            echo "notification.py 호출 실패(체크아웃 문제 또는 상태 파일 손상 등으로 추정) — 최소 폴백 알림 생성" 1>&2
            FAILED_STEP_FALLBACK="${FAILED_STEP:-알 수 없음(초기 단계 실패 또는 상태 파일 손상으로 상세 파악 불가)}" \
            python3 -c "
          import datetime, json, os
          owner = os.environ['OWNER']; run_id = os.environ['RUN_ID']; run_url = os.environ['RUN_URL']
          failed_step = os.environ['FAILED_STEP_FALLBACK']
          KST = datetime.timezone(datetime.timedelta(hours=9))
          today = datetime.datetime.now(KST).date().isoformat()
          marker = f'gaeo-evolution-run:{run_id}'
          body = (f'@{owner}\n\n'
                  '이번 Evolution 실행 결과를 평소 방식으로 보고하지 못했습니다 '
                  '(초기 단계 실패 또는 상태 파일 손상 추정).\n\n'
                  f'- 실패 단계: {failed_step}\n'
                  '- 오류 종류: 측정값 없음 (자세한 내용은 GitHub Actions 로그 확인)\n'
                  '- Production 자동승격: 없음\n- 대표 확인 필요: 예\n\n'
                  f'실행 로그: {run_url}\n\n'
                  '(Secret·토큰·전체 스택트레이스는 이 알림에 포함하지 않습니다.)\n\n'
                  f'<!-- {marker} -->\n')
          json.dump({'level': 'RED', 'title': f'🔴 [GAEO Evolution] 점검 필요 — {today}',
                     'body': body, 'marker': marker},
                    open('/tmp/gaeo_notify.json', 'w'), ensure_ascii=False, indent=1)
          "
          fi
          {
            echo "level=$(python3 -c "import json;print(json.load(open('/tmp/gaeo_notify.json'))['level'])")"
            echo "marker=$(python3 -c "import json;print(json.load(open('/tmp/gaeo_notify.json'))['marker'])")"
          } >> "$GITHUB_OUTPUT"

      - name: GitHub Issue로 대표에게 알림 (assignee + @멘션)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          MARKER: ${{ steps.notify_build.outputs.marker }}
        run: |
          set -euo pipefail
          python3 -c "
          import json
          doc = json.load(open('/tmp/gaeo_notify.json'))
          open('/tmp/gaeo_notify_title.txt', 'w', encoding='utf-8').write(doc['title'])
          open('/tmp/gaeo_notify_body.md', 'w', encoding='utf-8').write(doc['body'])
          "
          TITLE=$(cat /tmp/gaeo_notify_title.txt)
          # 같은 Run ID의 이슈가 이미 있으면 새로 만들지 않는다(재시도 중복 방지).
          # GitHub 검색 인덱싱에는 최대 수십 초 지연이 있을 수 있어 100% 보장은 아니다.
          EXISTING=$(gh issue list --state all --limit 5 \
            --search "\"${MARKER}\" in:body" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "이미 같은 Run(${MARKER})의 알림 이슈 #$EXISTING 존재 — 새로 만들지 않음"
          else
            gh issue create --title "$TITLE" --body-file /tmp/gaeo_notify_body.md --assignee "$OWNER"
            echo "새 알림 이슈 생성 완료(assignee=$OWNER, 본문에 @$OWNER 멘션 포함)"
          fi

  # ── GS Reference Check (2026-08-25 · 별도 job으로 격리) ─────────────────────
  # 왜 job을 나눴나 (2026-08-25 독립 보안 감사 HIGH)
  #   · gs-quant는 필수 런타임 의존성이 20개 넘게 딸려 온다(requests·httpx·
  #     websockets·opentelemetry 등). 그걸 `contents: write`이고 checkout이
  #     git 자격증명을 남겨 둔 job 안에서 설치하면, 공급망 사고 하나가 곧바로
  #     저장소 push 권한과 만난다.
  #   · 그래서 ①버전을 고정하고 ②권한을 읽기로 낮추고 ③persist-credentials를 꺼서
  #     git 자격증명 자체를 남기지 않는 별도 job으로 뺐다.
  #   · lab job과 서로 needs 관계가 없다 = 설치가 느리거나 실패해도 연구 실행·커밋·
  #     알림 어느 것도 지연시키거나 막지 않는다(Production 무영향 최우선).
  #   · 결과는 이 job의 Job Summary와 로그에 남는다. 주간 Issue의 Goldman 블록은
  #     "이 job을 보라"고 안내한다(알림 job이 이 산출물을 읽지 않는다).
  gs-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: gs-quant 설치 (버전 고정 · 실패해도 무시)
        run: |
          set -uo pipefail
          timeout 420 python3 -m pip install --quiet "gs-quant==2.1.4" \
            || echo "gs-quant 설치 실패 또는 시간초과 — 검산은 N/A로 보고된다" 1>&2

      - name: 위험지표 4단 교차검증 (검산 전용 · 네트워크/인증 호출 없음)
        run: |
          set -uo pipefail
          OUT="${RUNNER_TEMP:-/tmp}/gs_reference.json"
          python3 -m gaeo_reference.gs_reference --out "$OUT" \
            || echo "검산 실행 실패 — 결과 없음" 1>&2
          {
            echo "## GAEO Reference Check (검산 전용)"
            echo ""
            if [ -f "$OUT" ]; then
              OUT="$OUT" python3 -c "
          import json, os
          d = json.load(open(os.environ['OUT'], encoding='utf-8'))
          print('- 상태:', d.get('status'))
          print('- 사유:', d.get('reason'))
          print('- 케이스:', d.get('caseCount'), '· 일치', d.get('checkPass'),
                '· 불일치', d.get('checkWarn'), '· 미측정', d.get('checkNA'))
          print('- 외부 계산이 실제로 돈 케이스:', d.get('gsLegRanCases'),
                '· 계산 실패:', d.get('checkGsError'))
          print('- 사용한 계산 다리:', ', '.join(d.get('legsUsed') or []) or '없음')
          print('- 이 검산으로 만든 Candidate:', d.get('candidatesCreated'))
          print('')
          print('이 결과는 GAEO 판단(BUY/HOLD/SELL·점수·가중치)에 들어가지 않습니다.')
          "
            else
              echo "- 상태: N/A (산출물이 만들어지지 않음)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
