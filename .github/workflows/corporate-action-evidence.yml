# 개오 애널리스트팀 — 기업행사 증거 수집 (GAEO Private 판정부가 소비)
#
# 이 워크플로는 조회하고 대조하고 증거를 남길 뿐, 판정하지 않는다.
# 조회 실패·페이지 누락·건수 불일치를 0건으로 바꾸지 않는다.
# API Key 값은 어떤 로그·산출물에도 남지 않는다(dart_client.redact).
# 루프도 자기재기동도 sleep 도 없다. 한 번 돌고 끝난다.

name: corporate-action-evidence

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "이번 회차에 볼 종목 수 상한"
        default: "40"
      requests:
        description: "이번 회차 API 요청 수 상한"
        default: "300"
      commit:
        description: "증거를 main 에 커밋 (기본 true)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: corporate-action-evidence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPEN_DART_API_KEY: ${{ secrets.OPEN_DART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Secret 존재 여부만 확인 (값·길이 출력 없음)
        run: |
          if [ -n "$OPEN_DART_API_KEY" ]; then
            echo "secretPresent: true"
          else
            echo "secretPresent: false"
            echo "::error::OPEN_DART_API_KEY 가 없습니다. 수집을 시작하지 않습니다."
            exit 1
          fi

      - name: 오프라인 불변식 시험 (실패가 0건으로 바뀌지 않는지)
        run: python3 test_corporate_action_evidence.py

      - name: 실제 수집
        run: python3 collect_corporate_action_evidence.py --tickers "${{ inputs.tickers }}" --requests "${{ inputs.requests }}"

      - name: 증거 커밋
        if: ${{ inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gaeo_coverage/corporate_action_evidence.json || true
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "기업행사 증거 수집 (GitHub Actions) [skip ci]"
            for i in 1 2 3 4; do
              git push origin main && break
              sleep $((2 ** i))
              git pull --rebase origin main || true
            done
          fi

      - name: 증거 아티팩트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corporate-action-evidence
          path: gaeo_coverage/corporate_action_evidence.json
          if-no-files-found: warn
