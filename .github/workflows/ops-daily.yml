# 개오 일일 운영 점검 + 예정 시험 실행기 (2026-09-10 신설 · 구간 5)
#
# 왜 있나
#   예정 검증 시험(9/15 · 9/23 · 10/19 · 11/16 17:00 KST)이 Claude 세션의 Routine 에만 있었다. 세션·구독이
#   사라지면 시험도 사라진다. 일정 원본을 config/validation_schedule.json 에 두고, 이 워크플로가 평일 17:05 KST 에
#   "오늘 도래한 시험"만 allowlist 명령으로 돌려 append-only 원장(docs/audits/validation_runs/)에 남긴다. LLM 호출 0.
#   같은 run 에서 통합 상태 점검(ops_status.py --deep --github)을 한 번 돌려 장애를 제목 고정 이슈 1개로 알린다.
#
# 안전 규칙 (바꾸지 말 것)
#   - 예정 시각 전에는 실행하지 않는다(실행기가 거부). 같은 일정은 하루 1회. 원장은 덧붙이기만(지우면 커밋 실패).
#   - 실행 명령은 config 의 allowlist 만. 이 파일·이슈 본문·JSON 의 임의 문자열을 실행하지 않는다.
#   - 산식·Constitution·테스트를 고치지 않는다. 결과의 후속 조치는 followup 명세 파일로만 남긴다(코드 변경은 사람/개발 AI).
#   - 커밋 경로는 다섯뿐. 필수 셋(늘 있어야 한다): docs/audits/validation_runs/ · docs/VALIDATION_SCHEDULE.md ·
#     docs/operations/repair_requests/. 선택 둘(아직 없을 수 있다): official_prices/(공식 일별 시세 저장소 · 2026-09-17) ·
#     official_price_history.js(가격 차트용 파생 파일). 선택 경로가 아직 없으면 그 경로만 건너뛴다(2026-09-18 수리).
#     그 밖의 파일이 스테이지되면 커밋하지 않고 실패한다. 커밋은 main 에서만(schedule, 또는 apply=true 로 dispatch).
#   - 저장 실패(push 4회 실패·rebase 충돌)여도 공식 결과를 버리지 않는다(2026-09-10 구간 C): 같은 커밋을
#     validation-inbox-<run_id> 브랜치에 보존하고, 결과 폴더를 artifact 로도 올린다. 다음 run 이 시작할 때 inbox 를 회수해
#     같은 결과를 다시 발행한다(새 시세로 다시 채점하지 않는다). 알림·판정 스텝은 always() 라 앞 스텝이 죽어도 돈다.
#   - 실행기 계획 모드는 아무 명령도 돌리지 않는다. 확인 시험(9/15·9/23)은 표본 수만 센다(구조 가드).
#   - push 트리거가 없다 — 브랜치에 이 파일을 올려도 기동하지 않는다. 브랜치 시험은 workflow_dispatch(apply=false = 계획만).
#   - 토스·네이버·DART 호출 0. GITHUB_TOKEN 만 쓴다(새 Secret 없음). force push · reset --hard · 이력 재작성 없음.
#   - 계약 테스트(gaeo_check.py schedule)가 깨져 있으면 아무 시험도 돌리지 않는다.
name: ops-daily

on:
  schedule:
    # 08:05 UTC = 17:05 KST 평일. 장 마감·paper-health-alert(16:30) 뒤. GitHub cron 은 지연될 수 있다 —
    # 실행기가 "예정 시각을 N시간 지남"을 기록으로 남기므로 지연은 숨겨지지 않는다.
    - cron: "5 8 * * 1-5"
    # 예비 발화(2026-09-10 구간 D 실측: 첫 예정일 17:05 발화가 20:40 KST 까지 0회). 실행기는 일정당 하루 1회만 기록하고
    # 이슈는 제목 고정이라 여러 번 떠도 중복이 없다 — 단, 아래 checkout 의 ref 가 있어야 성립한다(뒤 run 이 앞 run 의 원장 커밋을
    # 봐야 하므로). 정각 근처는 GitHub 부하 시간이라 분을 흩어 둔다. 예비 목록은 config/validation_schedule.json runner.backupCron 과 같아야 한다.
    - cron: "37 8 * * 1-5"
    - cron: "11 9 * * 1-5"
  workflow_dispatch:
    inputs:
      apply:
        description: "도래한 예정 시험을 실제로 실행·기록한다 (false = 계획만 출력, 아무것도 쓰지 않음)"
        type: boolean
        default: false

permissions:
  contents: write     # 기록 커밋(허용 경로 5곳만 · 필수 3 + 선택 2)
  issues: write       # 실행 기록 이슈 · 장애 이슈(제목 고정, 각 1개)

concurrency:
  group: ops-daily
  cancel-in-progress: false

jobs:
  ops:
    # 포크에서는 돌지 않는다(남의 저장소에 커밋·이슈를 만들지 않게).
    if: github.repository == 'rudvh1016-gif/gaeo-analyst-team'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      # 기록(파일 커밋·이슈)은 main 에서 schedule 로 돌 때, 또는 사람이 apply=true 로 dispatch 했을 때만.
      APPLY: ${{ (github.event_name == 'schedule' || inputs.apply == true) && github.ref == 'refs/heads/main' }}
      VALIDATION_TITLE: "📅 [GAEO Validation] 예정 시험 실행 기록"
      OPS_TITLE: "🩺 [GAEO Ops] 일일 통합 점검 장애"
    steps:
      # ⚠️ ref 를 명시한다(2026-09-10 별도 검토 P0-1). 없으면 run 이 "생성된 시점"의 커밋(github.sha)을 받는다 — 예비 cron 이
      #    원본 지연과 겹쳐 두 run 이 줄을 서면, 뒤 run 은 앞 run 이 push 한 원장 줄을 못 보고 같은 시험을 다시 돌려 원장이 충돌한다.
      #    ref 를 주면 체크아웃 시점의 브랜치 끝을 받으므로(concurrency 로 직렬화됨) 앞 run 의 기록을 보고 하루 1회 규칙이 지켜진다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 실행기 계약 테스트 (깨져 있으면 아무 시험도 돌리지 않는다)
        run: python3 gaeo_check.py schedule

      # 판정만 한다. 장애가 있으면 exit 1 이지만 이 job 을 실패시키지 않는다(아래 이슈 스텝이 알린다).
      # "확인 못 함"(exit 2)은 정상으로도 장애로도 적지 않는다.
      - name: 통합 상태 점검 (판정만 · 장애면 수리 요청서)
        id: ops
        run: |
          # ⚠️ 2026-09-19 run 35363327604 재현·수리: 점검 본문은 "결론: 장애 1건"(SCHEDULED_RUNS_FAULT ·
          #    서명 214b8601d4)이었는데 알림 단계는 CODE: 0 을 받아 "정상"으로 처리했다. 원인은 셸 한 줄이다 —
          #    `python3 … | tee A | tee -a B || code=$?` 에서 파이프라인의 종료코드는 **마지막 tee** 것이므로,
          #    점검이 1(장애)·2(확인 불가)로 끝나도 tee 가 성공하면 `||` 가 발동하지 않고 code 가 0 으로 남았다.
          #    그래서 파이프라인 **직후에** PIPESTATUS 배열을 통째로 보존하고(다른 명령 하나만 끼워도 덮인다),
          #    점검 프로그램의 코드(PS[0])와 로그 복사의 코드(PS[1]·PS[2])를 따로 읽는다.
          #    ops_status.py 계약: 0 정상 · 1 장애 · 2 확인 불가. 이 숫자의 뜻은 프로그램마다 다르니 섞지 않는다.
          args=""
          [ "$APPLY" = "true" ] && args="--save-performance-state"
          set +e
          python3 ops_status.py --deep --github $args --json "$RUNNER_TEMP/ops.json" \
            --repair-request docs/operations/repair_requests \
            | tee "$RUNNER_TEMP/ops.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          PS=("${PIPESTATUS[@]}")
          set -e
          code="${PS[0]:-1}"
          log=ok
          for s in "${PS[@]:1}"; do [ "${s:-0}" = "0" ] || log=fail; done
          if [ "$log" = "fail" ]; then
            echo "::error::요약 로그 복사(tee) 실패 — 점검 판정과는 별개의 실행 문제다(코드 ${PS[*]}). 마지막 판정 스텝이 run 을 빨갛게 만든다"
          fi
          # 보고서(JSON)가 없거나 깨졌으면 "정상"으로 적지 않는다 — 판정을 확인할 수 없으면 확인 불가(2)다.
          # 장애(1)는 그대로 둔다: 점검이 이미 장애라고 말했으므로 이슈로 알려야 한다.
          sig=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); ok=isinstance(d.get("faults"),list) and isinstance(d.get("unknowns"),list) and bool(d.get("signature")); print(d["signature"] if ok else "")' "$RUNNER_TEMP/ops.json" 2>/dev/null || true)
          report=ok
          if [ -z "$sig" ]; then
            report=broken
            [ "$code" = "1" ] || code=2
            echo "::error::점검 보고서(ops.json)가 없거나 깨졌다 — 정상으로 적지 않는다(전달 판정 $code)"
          fi
          {
            echo "code=$code"
            echo "signature=${sig:-unknown}"
            echo "log=$log"
            echo "report=$report"
          } >> "$GITHUB_OUTPUT"
          echo "점검 판정 전달: $code (0 정상 · 1 장애 · 2 확인 불가) · 서명 ${sig:-unknown} · 로그 복사 $log · 보고서 $report"

      # 저장소 용량(GitHub 집계)을 매일 남긴다. 읽기만 한다 — 압축은 사람이 compact-history 를 confirm 으로 돌릴 때만(docs/HISTORY_PRESERVATION.md).
      - name: 저장소 용량 보고 (비파괴 · 3 GiB NOTICE · 4.5 GiB PROTECT)
        continue-on-error: true
        run: |
          # 같은 tee 결함(2026-09-19). 이 프로그램의 계약은 ops_status 와 **다르다**:
          # 0 OK/NOTICE · 1 PROTECT(4.5 GiB 넘음) · 2 UNKNOWN(집계를 못 읽음). tee 뒤에 두면 1·2 가 초록으로 숨었다.
          # continue-on-error 는 그대로 둔다 — 용량은 알림만 하고 run 을 막지 않는 항목이다.
          set +e
          python3 check_history_evidence.py --report | tee -a "$GITHUB_STEP_SUMMARY"
          PS=("${PIPESTATUS[@]}")
          set -e
          if [ "${PS[1]:-0}" != "0" ]; then
            echo "::warning::요약 로그 복사(tee) 실패 — 용량 판정과는 별개의 실행 문제다"
          fi
          case "${PS[0]:-1}" in
            0) ;;
            1) echo "::warning::저장소 용량 PROTECT 단계 — 사람이 docs/HISTORY_PRESERVATION.md 의 수동 압축 절차를 검토해야 한다";;
            2) echo "::warning::저장소 용량을 집계하지 못했다(UNKNOWN) — 모르는 것을 정상으로 적지 않는다";;
            *) echo "::warning::용량 보고 실행 자체가 실패했다(코드 ${PS[0]:-1})";;
          esac
          exit "${PS[0]:-1}"

      # ⚖️ 2026-09-17 공식 일별 시세(금융위원회_주식시세정보 15094808) — 이 워크플로의 기존 발화(평일 17:05 KST)에 얹어 하루 1회,
      #    비어 있는 최근 기준일만 받는다(요청 상한 6 · 새 schedule 아님). 게이트가 닫혀 있거나 키가 없으면 아무것도 받지 않고 상태만
      #    남긴다(키 값은 출력하지 않는다). 실패해도 네이버로 복귀하지 않는다 — 저장소의 마지막 정상 자료가 기준일과 함께 남는다.
      #    차트용 파생 파일(official_price_history.js)은 스위치(consumerMigrations.priceChart.enabled)에 따라 비어 있거나 채워진다.
      - name: 공식 일별 시세 수집 (FSC 15094808 · 하루 1회 · 요청 상한 6 · 네이버 복귀 없음)
        id: fsc
        if: env.APPLY == 'true'
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          code=0
          if python3 legal_source_gate.py --require fsc_public_data:automatedCollection; then
            python3 -m data_supply.fsc_daily_collect --if-due --max-requests 6 --summary "$GITHUB_STEP_SUMMARY" || code=$?
          else
            echo "FSC 게이트 닫힘 — 수집 생략(네트워크 0)"; code=2
          fi
          python3 build_official_price_history.py || echo "::warning::official_price_history.js 생성 실패"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # 지난 run 이 push 에 실패해 inbox 브랜치에 남긴 결과가 있으면 먼저 회수한다(같은 결과 재발행 · 재채점 0).
      # 회수한 파일은 아래 기록 커밋 스텝이 함께 커밋한다. 브랜치 삭제는 main 저장이 확인된 뒤에만.
      - name: 저장 실패로 남은 결과 회수 (validation-inbox-* → 작업트리)
        id: inbox
        if: env.APPLY == 'true'
        continue-on-error: true
        run: |
          # 같은 tee 결함(2026-09-19) + 마지막 grep 까지 코드를 덮어, 회수 실패가 두 겹으로 숨어 있었다.
          # --reconcile-inbox 계약: 0 회수 성공(회수할 게 없어도 0) · 1 회수 실패.
          set +e
          python3 run_validation_schedule.py --reconcile-inbox | tee "$RUNNER_TEMP/inbox.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          PS=("${PIPESTATUS[@]}")
          set -e
          # 회수 목록은 코드와 무관하게 남긴다 — 일부만 회수됐어도 아래 저장 확인 스텝이 그 브랜치를 알아야 한다.
          grep -o '^RECONCILED .*' "$RUNNER_TEMP/inbox.txt" | sed 's/^RECONCILED //' > "$RUNNER_TEMP/inbox_branches.txt" || true
          for s in "${PS[@]:1}"; do
            [ "${s:-0}" = "0" ] || echo "::warning::요약 로그 복사(tee) 실패 — 회수 결과와는 별개의 실행 문제다"
          done
          if [ "${PS[0]:-1}" != "0" ]; then
            echo "::error::저장 실패로 남은 결과 회수에 실패했다(코드 ${PS[0]:-1}) — inbox 브랜치는 지우지 않으므로 다음 run 이 다시 시도한다"
          fi
          exit "${PS[0]:-1}"

      # apply 가 아니면 --apply 없이 계획만 출력한다(아무 명령도 실행하지 않고 파일도 쓰지 않는다). 실패해도 여기서 죽지 않고
      # 종료코드를 기록해 둔 뒤, 기록 커밋·이슈까지 마친 다음 마지막 스텝에서 run 을 빨갛게 만든다.
      - name: 예정 시험 실행기 (도래한 시험만 · allowlist · 하루 1회)
        id: vs
        run: |
          # ⚠️ 2026-09-19: 여기도 같은 tee 결함이었다 — 실행기가 1(실패·사람 확인 필요)·2(BLOCKED·구조 가드)로
          #    끝나도 마지막 tee 가 성공하면 code 가 0 으로 남아, 아래 이슈 스텝의 발동 조건과 마지막 판정이
          #    둘 다 "정상"을 봤다. PIPESTATUS 를 파이프라인 직후에 보존해 실행기의 코드를 그대로 전달한다.
          #    run_validation_schedule.py 계약: 0 정상 · 1 실패·이상·사람 확인 필요 · 2 BLOCKED·구조 가드·거부.
          #    이 프로그램의 2 는 ops_status 의 2("확인 불가")와 뜻이 다르다 — 여기서는 0 이 아니면 전부
          #    마지막 판정에서 run 을 빨갛게 만든다(기존 계약 유지).
          args=""
          [ "$APPLY" = "true" ] && args="--apply"
          set +e
          python3 run_validation_schedule.py $args --runner-name github-actions \
            --json "$RUNNER_TEMP/vs.json" --issue-body "$RUNNER_TEMP/vs_issue.md" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          PS=("${PIPESTATUS[@]}")
          set -e
          code="${PS[0]:-1}"
          log=ok
          for s in "${PS[@]:1}"; do [ "${s:-0}" = "0" ] || log=fail; done
          if [ "$log" = "fail" ]; then
            echo "::error::요약 로그 복사(tee) 실패 — 실행기 판정과는 별개의 실행 문제다(코드 ${PS[*]})"
          fi
          notify=$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1])).get("notify", False)).lower())' "$RUNNER_TEMP/vs.json" 2>/dev/null || echo true)
          # 실행기가 실패해도 이 스텝은 0 으로 끝난다(의도) — 그래야 기록 커밋·보관·이슈 스텝이 이어서 돌고,
          # 마지막 판정 스텝이 그때 run 을 빨갛게 만든다. 표 재생성 실패도 기록·알림을 막지 않는다.
          if [ "$APPLY" = "true" ] && ! python3 render_validation_schedule.py; then
            log=fail
            echo "::error::docs/VALIDATION_SCHEDULE.md 재생성 실패 — 기록·알림은 계속하고 마지막 판정에서 run 을 빨갛게 만든다"
          fi
          {
            echo "code=$code"
            echo "notify=$notify"
            echo "log=$log"
          } >> "$GITHUB_OUTPUT"
          echo "실행기 판정 전달: $code (0 정상 · 1 실패·사람 확인 · 2 BLOCKED·구조 가드) · 알림 $notify · 로그 복사 $log"

      - name: 기록 커밋 (main · 허용 경로 5곳만 · 원장은 덧붙이기만)
        id: commit
        if: env.APPLY == 'true'
        continue-on-error: true
        run: |
          echo "committed=" >> "$GITHUB_OUTPUT"
          # ⚠️ 2026-09-18 run 35350908284: official_prices/ 가 아직 없다는 이유로 git add 가
          #    "fatal: pathspec 'official_prices' did not match any files"(exit 128)로 죽어,
          #    멀쩡한 점검 기록까지 통째로 저장되지 못했다. 그래서 경로를 둘로 나눈다.
          #    필수: 늘 있어야 하는 기록 경로. 없으면 사고이므로 숨기지 않고 실패시킨다.
          #    선택: 아직 안 생겼을 수 있는 경로(공식 시세는 서비스키 승인 뒤에 생긴다).
          #    선택 경로라도 Git 이 이미 추적 중이면 반드시 포함한다 — 삭제를 "파일 없음"으로 숨기지 않기 위해서다.
          REQUIRED="docs/audits/validation_runs docs/VALIDATION_SCHEDULE.md docs/operations/repair_requests"
          OPTIONAL="official_prices official_price_history.js"
          ADD=""
          for p in $REQUIRED; do
            if [ ! -e "$p" ] && [ -z "$(git ls-files -- "$p")" ]; then
              echo "::error::필수 기록 경로가 없다: $p"; exit 1
            fi
            ADD="$ADD $p"
          done
          for p in $OPTIONAL; do
            if [ -e "$p" ] || [ -n "$(git ls-files -- "$p")" ]; then ADD="$ADD $p"
            else echo "선택 경로가 아직 없다 — 이 경로만 건너뛴다: $p"; fi
          done
          git add -A -- $ADD
          if git diff --cached --quiet; then echo "변경 없음 — 커밋하지 않는다"; echo "nothing=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          for p in $(git diff --cached --name-only); do
            case "$p" in
              docs/audits/validation_runs/*|docs/VALIDATION_SCHEDULE.md|docs/operations/repair_requests/*|official_prices/*|official_price_history.js) ;;
              *) echo "::error::허용 밖 경로가 스테이지됐다: $p"; exit 1;;
            esac
          done
          if git diff --cached -- docs/audits/validation_runs/ledger.jsonl | grep -q '^-[^-]'; then
            echo "::error::원장(ledger.jsonl)에서 줄이 지워지거나 바뀌었다 — 덧붙이기만 허용"; exit 1
          fi
          if [ -n "$(git diff --cached --diff-filter=DM --name-only -- docs/audits/validation_runs ':(exclude)docs/audits/validation_runs/ledger.jsonl')" ]; then
            echo "::error::기존 결과 파일이 수정·삭제됐다 — 결과는 새 파일로만"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "ops-daily: 예정 시험·점검 기록 $(date '+%Y-%m-%d %H:%M') KST [skip ci]"
          echo "committed=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          for i in 1 2 3 4; do
            timeout 60 git push origin HEAD:main && { echo "push 완료"; echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; }
            echo "push 거부/지연 — 원격 반영 후 재시도 ($i/4)"; sleep $((2 ** i))
            timeout 120 git fetch origin main || continue
            git rebase origin/main || { git rebase --abort; echo "::error::rebase 충돌 — 이번 기록 커밋 보류(다음 run 이 다시 만든다)"; exit 1; }
            # rebase 는 커밋 SHA 를 바꾼다. 저장 확인·inbox 보존에 옛 SHA 를 넘기지 않는다.
            echo "committed=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          done
          echo "::error::push 4회 실패 — 아래 보존 스텝이 inbox 브랜치·artifact 로 남긴다"; exit 1

      # 저장 실패 보존: 커밋은 만들어졌는데 main 에 못 올렸으면 같은 커밋을 inbox 브랜치로 올린다(재채점 0).
      - name: 저장 실패 보존 (같은 커밋을 validation-inbox-<run_id> 브랜치로)
        id: inboxsave
        if: always() && env.APPLY == 'true' && steps.commit.outcome == 'failure' && steps.commit.outputs.committed != ''
        continue-on-error: true
        run: |
          B="validation-inbox-${GITHUB_RUN_ID}"
          for i in 1 2 3; do
            timeout 60 git push origin "HEAD:refs/heads/$B" && { echo "inbox 보존 완료: $B"; echo "branch=$B" >> "$GITHUB_OUTPUT"; exit 0; }
            sleep $((2 ** i))
          done
          echo "::error::inbox 브랜치 push 도 실패 — artifact 와 이슈 본문이 마지막 보존이다"; exit 1

      # 어떤 경우든 결과 폴더를 artifact 로 남긴다(임시 보존 90일 — 정식 저장은 main 커밋).
      - name: 결과 보관본 업로드 (artifact · 임시 보존)
        if: always() && env.APPLY == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: validation-runs-${{ github.run_id }}
          path: |
            docs/audits/validation_runs
            docs/operations/repair_requests
          if-no-files-found: ignore
          retention-days: 90

      # 저장 상태를 넷으로 나눠 적는다: 파일 생성 / 커밋 / 원격(main) 저장 확인 / 사람 전달(이슈). 하나라도 확인 못 하면 ✗ 로 적는다.
      - name: 저장 확인 (파일·커밋·원격·전달을 따로 기록)
        id: saved
        if: always() && env.APPLY == 'true'
        continue-on-error: true
        run: |
          C="${{ steps.commit.outputs.committed }}"; P="${{ steps.commit.outputs.pushed }}"; N="${{ steps.commit.outputs.nothing }}"
          IB="${{ steps.inboxsave.outputs.branch }}"
          FILES=$(ls docs/audits/validation_runs/*/*.json 2>/dev/null | wc -l | tr -d ' ')
          REMOTE="✗ 미확인"
          verified=false
          if [ "$P" = "true" ] && [ -n "$C" ]; then
            # push 직후 다른 수집기가 main 을 전진시킬 수 있다. SHA 문자열만 읽으면 새 객체가
            # 로컬에 없어 포함성 검사가 실패한다. 실제 main 객체를 되읽고 확인한 뒤에만 inbox 를 지운다.
            if timeout 120 git fetch origin main; then
              R=$(git rev-parse refs/remotes/origin/main)
              if [ "$R" = "$C" ] || git merge-base --is-ancestor "$C" "$R" 2>/dev/null; then
                REMOTE="✔ main 에 있음($C)"; verified=true
              else REMOTE="✗ main 에서 못 찾음($C ≠ $R)"; fi
            else REMOTE="✗ main 조회 실패 — 저장 여부 미확인, inbox 보존"; fi
          elif [ -n "$IB" ]; then REMOTE="△ inbox 브랜치 $IB 에만 있음(다음 run 이 --reconcile-inbox 로 회수)"
          elif [ "$N" = "true" ]; then REMOTE="— 변경 없음(커밋 없음)"
          elif [ -z "$C" ]; then REMOTE="✗ 커밋 자체가 없음 — artifact 만 보존, 자동 회수 경로 없음(사람이 내려받아 넣어야 한다)"
          else REMOTE="✗ 커밋은 있으나 main·inbox 모두 실패 — artifact 만 보존, 자동 회수 경로 없음"
          fi
          {
            echo "### 저장 확인"
            echo "- 로컬 결과 파일: ${FILES}개"
            echo "- 커밋: ${C:-없음}"
            echo "- 원격 저장: $REMOTE"
            echo "- 사람 전달: 아래 이슈 스텝 결과 참조"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "remote=$REMOTE" >> "$GITHUB_OUTPUT"
          echo "verified=$verified" >> "$GITHUB_OUTPUT"
          # main 저장이 확인된 뒤에만 회수한 inbox 브랜치를 지운다(지우기 전엔 언제든 다시 회수할 수 있다).
          if [ "$P" = "true" ] && [ "$verified" != "true" ]; then
            echo "::error::main 저장을 되읽어 확인하지 못했다 — inbox 를 보존하고 마지막 판정에서 실패로 알린다"; exit 1
          fi
          if [ "$verified" = "true" ] && [ -s "$RUNNER_TEMP/inbox_branches.txt" ]; then
            while read -r b; do [ -n "$b" ] && timeout 60 git push origin --delete "$b" && echo "inbox 브랜치 삭제: $b"; done < "$RUNNER_TEMP/inbox_branches.txt"
          fi

      - name: 예정 시험 이슈 갱신 (실행했거나 사람 확인이 필요할 때만 · 제목 고정 1개)
        if: always() && env.APPLY == 'true' && (steps.vs.outputs.notify == 'true' || steps.vs.outputs.code != '0' || steps.commit.outcome == 'failure')
        run: |
          {
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} · 실행기 종료코드 ${{ steps.vs.outputs.code }} · 원격 저장: ${{ steps.saved.outputs.remote }}"
            echo ""
            cat "$RUNNER_TEMP/vs_issue.md" 2>/dev/null || echo "(실행기 요약 파일 없음 — run 로그 확인)"
            if [ "${{ steps.commit.outcome }}" = "failure" ]; then
              echo ""
              # ⚠️ 2026-09-18: inbox 브랜치가 없는데도 "다음 run 이 회수한다"고 적어 사람을 안심시켰다. 실제 보존 위치로만 적는다.
              IB="${{ steps.inboxsave.outputs.branch }}"
              if [ -n "$IB" ]; then
                echo "⚠️ main 저장 실패. 보존: inbox 브랜치 \`$IB\` (다음 run 이 --reconcile-inbox 로 회수 · 재채점 없음) + artifact validation-runs-${GITHUB_RUN_ID}."
              else
                echo "⚠️ main 저장 실패, inbox 브랜치도 없음(커밋 전에 멈췄거나 inbox push 실패). 보존은 artifact validation-runs-${GITHUB_RUN_ID} 뿐이고 **자동 회수 경로가 없다** — 사람이 artifact 를 내려받아 넣어야 한다."
              fi
            fi
          } > "$RUNNER_TEMP/vs_body.md"
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                --jq "map(select(.title == \"${VALIDATION_TITLE}\")) | .[0].number // empty")
          if [ -n "$NUM" ]; then gh issue comment "$NUM" --body-file "$RUNNER_TEMP/vs_body.md"
          else gh issue create --title "$VALIDATION_TITLE" --body-file "$RUNNER_TEMP/vs_body.md"; fi

      # 장애(exit 1)면 서명이 새로울 때만 쓰고, 정상(exit 0)이면 닫는다. 확인 못 함(exit 2)이면 아무 것도 하지 않는다.
      - name: 장애 이슈 (같은 사고는 다시 쓰지 않음 · 정상이면 닫음)
        if: always() && env.APPLY == 'true' && steps.ops.outputs.code != '2' && steps.ops.outputs.code != ''
        env:
          CODE: ${{ steps.ops.outputs.code }}
          SIG: ${{ steps.ops.outputs.signature }}
        run: |
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                --jq "map(select(.title == \"${OPS_TITLE}\")) | .[0].number // empty")
          if [ "$CODE" = "0" ]; then
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" --reason completed --comment "통합 점검 정상 — 자동으로 닫습니다 ($(date '+%Y-%m-%d %H:%M') KST)."
            fi
            echo "정상"; exit 0
          fi
          MARK="gaeo-ops-signature:${SIG}"
          if [ -n "$NUM" ] && gh issue view "$NUM" --json body,comments --jq '.body, .comments[].body' | grep -q "$MARK"; then
            echo "같은 사고(서명 $SIG)가 이미 기록돼 있다 — 다시 쓰지 않는다"; exit 0
          fi
          {
            echo "<!-- $MARK -->"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            cat "$RUNNER_TEMP/ops.txt" 2>/dev/null || echo "(요약 없음 — run 로그 확인)"
            echo ""
            echo "수리 요청서: \`docs/operations/repair_requests/\` (같은 사고는 같은 INC 번호). 조치 순서는 \`docs/HARNESS.md\` §4."
          } > "$RUNNER_TEMP/ops_body.md"
          if [ -n "$NUM" ]; then gh issue comment "$NUM" --body-file "$RUNNER_TEMP/ops_body.md"
          else gh issue create --title "$OPS_TITLE" --body-file "$RUNNER_TEMP/ops_body.md"; fi

      - name: 결과 판정 (실행기 실패·사람 확인 필요·저장 실패·로그 기록 실패면 이 run 을 빨갛게)
        if: always()
        env:
          CODE: ${{ steps.vs.outputs.code }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          SAVE_OUTCOME: ${{ steps.saved.outcome }}
          VS_LOG: ${{ steps.vs.outputs.log }}
          OPS_CODE: ${{ steps.ops.outputs.code }}
          OPS_LOG: ${{ steps.ops.outputs.log }}
          OPS_REPORT: ${{ steps.ops.outputs.report }}
        run: |
          # 첫 실패에서 바로 나가지 않고 이유를 전부 적는다 — 한 번의 run 로그로 원인을 다 보게.
          fail=0
          # 통합 점검의 판정(0·1·2)은 이 run 의 색을 바꾸지 않는다: 장애는 위 이슈 스텝이 알리는 기존 설계다.
          echo "통합 점검 전달 판정: ${OPS_CODE:-없음} (0 정상 · 1 장애 · 2 확인 불가) · 보고서 ${OPS_REPORT:-없음}"
          if [ "${CODE:-1}" != "0" ]; then echo "::error::예정 시험 실행기 종료코드 ${CODE:-없음} — 위 요약과 이슈를 확인"; fail=1; fi
          if [ "$COMMIT_OUTCOME" = "failure" ]; then echo "::error::기록 저장(main push) 실패 — inbox/artifact 보존 여부를 요약에서 확인"; fail=1; fi
          if [ "$SAVE_OUTCOME" = "failure" ]; then echo "::error::main 저장 되읽기·보존 확인 실패 — 위 저장 확인 요약을 확인"; fail=1; fi
          # 로그 기록(tee) 실패·보고서 누락은 "점검 결과"가 아니라 별개의 실행 문제다 — 기록·알림을 다 마친 뒤 여기서 드러낸다.
          if [ "$OPS_LOG" = "fail" ] || [ "$VS_LOG" = "fail" ]; then
            echo "::error::요약 로그 기록 실패 — 판정과 별개의 실행 문제다(점검 ${OPS_LOG:-—} · 실행기 ${VS_LOG:-—})"; fail=1
          fi
          if [ "$OPS_REPORT" = "broken" ]; then
            echo "::error::통합 점검 보고서(ops.json)가 없거나 깨졌다 — 정상으로 적지 않고 확인 불가로 전달했다"; fail=1
          fi
          [ "$fail" = "0" ] || exit 1
          echo "정상 종료"
